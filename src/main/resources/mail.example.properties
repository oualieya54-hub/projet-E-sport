# Copiez ce fichier en mail.properties (à la racine de resources) et renseignez vos valeurs.
# mail.properties est ignoré par Git pour ne pas commiter de mots de passe.

# Mettez à true une fois l’adresse et le mot de passe renseignés.
mail.send.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.starttls.enable=true
mail.smtp.auth=true
mail.smtp.user=votre.email@gmail.com
mail.smtp.password=mot_de_passe_application
mail.from=votre.email@gmail.com
mail.from.name=Game Pilot Academy
